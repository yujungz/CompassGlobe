# 生产环境 Docker Compose
# 用法: docker-compose up -d --build

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: compass-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: compass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: compass-redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端服务
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: server-production
    container_name: compass-server
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/compass?schema=public
      - JWT_SECRET=${JWT_SECRET:-compass-jwt-secret}
      - TDT_KEY=${TDT_KEY:-}
      - AMAP_KEY=${AMAP_KEY:-}
      - QWEATHER_KEY=${QWEATHER_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-smtp.qq.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Nginx（前端 + 后台管理 + API 代理）
  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: nginx-production
    container_name: compass-nginx
    restart: always
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8110:80"
    depends_on:
      - server

volumes:
  postgres_data:
  redis_data:

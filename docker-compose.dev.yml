# 开发环境 Docker Compose
# 用法: docker-compose -f docker-compose.dev.yml up -d

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: compass-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: compass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: compass-redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO 对象存储
  minio:
    image: minio/minio:latest
    container_name: compass-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端服务（挂载源码，热重载）
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: server-deps
    container_name: compass-server
    env_file:
      - ./apps/server/.env
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/compass?schema=public
      - QWEATHER_PRIVATE_KEY_PATH=/run/secrets/qweather_ed25519
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=compass
      - MINIO_USE_SSL=false
      - STORAGE_ROOT=/app/storage
      - AMAP_KEY=82f312a45f750e9962fff34d82421215
    volumes:
      - ./apps/server/src:/app/apps/server/src
      - ./apps/server/prisma:/app/apps/server/prisma
      - ./secrets/qweather-ed25519.pem:/run/secrets/qweather_ed25519:ro
      - storage_data:/app/storage
    ports:
      - "3001:3001"
    command: sh -c "npx prisma generate && npx tsx watch src/index.ts"
    working_dir: /app/apps/server
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Nginx 开发代理
  nginx:
    image: nginx:alpine
    container_name: compass-nginx
    volumes:
      - ./docker/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./apps/web/dist:/usr/share/nginx/html/front
      - ./apps/admin/dist:/usr/share/nginx/html/back
    ports:
      - "8110:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - server

volumes:
  postgres_data:
  redis_data:
  minio_data:
  storage_data:

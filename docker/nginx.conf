events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # 后端 API
    upstream server {
        server server:3001;
    }

    server {
        listen 80;
        server_name localhost;

        # 确保所有重定向使用相对路径（保留浏览器端口）
        absolute_redirect off;

        root /usr/share/nginx/html;

        # API 代理
        location /api {
            proxy_pass http://server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
        }

        # 前端主应用 /front（SPA：/front 和 /front/ 均可用，无重定向）
        location /front {
            alias /usr/share/nginx/html/front;
            try_files $uri /front/index.html;
        }

        # 后台管理 /back（SPA：/back 和 /back/ 均可用，无重定向）
        location /back {
            alias /usr/share/nginx/html/back;
            try_files $uri /back/index.html;
        }

        # 默认重定向到前端
        location = / {
            return 301 /front/;
        }

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
